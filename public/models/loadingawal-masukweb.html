<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric 3D Rubik Cube Loader</title>
    <style>
        :root {
            --size: 42px;
            --half: 21px;
            --gap: 3px;
            --color-top: #22D3EE;       /* Primary Cyan */
            --color-right: #0ea5e9;     /* Secondary Light Blue */
            --color-left: #0369a1;      /* Darker Blue */
            --color-dark: #0f172a;      /* Hidden Side */
            --bg-color: #0b0f19;        /* Background */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            overflow: hidden;
            perspective: 1200px;
        }

        /* Container panggung isometrik */
        .stage {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Bayangan di lantai */
        .floor-shadow {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.25) 0%, rgba(15, 23, 42, 0) 70%);
            transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px);
            border-radius: 50%;
            filter: blur(8px);
            animation: shadowPulse 4.5s ease-in-out infinite;
        }

        /* Rubik Group yang berotasi */
        .rubik-group {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg);
            animation: groupRotate 4.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        /* Struktur Kubus */
        .cube {
            position: absolute;
            width: var(--size);
            height: var(--size);
            transform-style: preserve-3d;
            top: calc(var(--size) * -0.5);
            left: calc(var(--size) * -0.5);
            animation: assembleCube 4.5s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
            opacity: 0;
        }

        /* Sisi-sisi 3D */
        .face {
            position: absolute;
            width: var(--size);
            height: var(--size);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backface-visibility: hidden;
        }

        .face.top {
            background-color: var(--color-top);
            transform: rotateX(0deg) translateZ(var(--half));
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .face.bottom {
            background-color: var(--color-dark);
            transform: rotateX(180deg) translateZ(var(--half));
        }

        .face.left {
            background-color: var(--color-left);
            transform: rotateY(-90deg) translateZ(var(--half));
        }

        .face.right {
            background-color: var(--color-right);
            transform: rotateY(90deg) translateZ(var(--half));
        }

        .face.front {
            background-color: var(--color-left);
            transform: rotateX(-90deg) translateZ(var(--half));
        }

        .face.back {
            background-color: var(--color-right);
            transform: rotateX(90deg) translateZ(var(--half));
        }

        /* Urutan Delay & Posisi 8 Kubus (2x2x2) */
        /* Layer Bawah */
        .c1 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.05s; }
        .c2 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.20s; }
        .c3 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.35s; }
        .c4 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.50s; }

        /* Layer Atas */
        .c5 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 0.70s; }
        .c6 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 0.85s; }
        .c7 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 1.00s; }
        .c8 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 1.15s; }

        .cube {
            animation-delay: var(--delay);
        }

        /* Keyframes Animasi Tiap Kubus */
        @keyframes assembleCube {
            0% {
                transform: translate3d(var(--tx), var(--ty), calc(var(--tz) + 70px)) scale(0.1);
                opacity: 0;
            }
            15% {
                transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);
                opacity: 1;
            }
            70% {
                transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);
                opacity: 1;
            }
            82% {
                transform: translate3d(calc(var(--tx) * 1.3), calc(var(--ty) * 1.3), calc(var(--tz) * 1.3)) scale(0.9);
                opacity: 0.8;
            }
            92%, 100% {
                transform: translate3d(var(--tx), var(--ty), calc(var(--tz) - 60px)) scale(0);
                opacity: 0;
            }
        }

        /* Keyframes Rotasi Grup Rubik */
        @keyframes groupRotate {
            0%, 25% {
                transform: rotateX(60deg) rotateZ(-45deg) translateZ(0);
            }
            50%, 75% {
                transform: rotateX(60deg) rotateZ(135deg) translateZ(10px);
            }
            90%, 100% {
                transform: rotateX(60deg) rotateZ(315deg) translateZ(0);
            }
        }

        /* Keyframes Bayangan */
        @keyframes shadowPulse {
            0%, 25% {
                transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(0.8);
                opacity: 0.4;
            }
            50%, 75% {
                transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(1.1);
                opacity: 0.7;
            }
            90%, 100% {
                transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(0.7);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="floor-shadow"></div>
        <div class="rubik-group" id="rubik">
            <!-- 8 Bagian Kubus -->
            <div class="cube c1"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c2"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c3"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c4"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c5"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c6"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c7"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
            <div class="cube c8"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
        </div>
    </div>

    </body>
</html>
