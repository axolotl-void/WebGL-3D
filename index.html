<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL HUD Portfolio</title>
    <!-- Load Orbitron and Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <style>
      /* R28 v4 — Pure CSS loader, no React dependency. Auto-hide after 3.5s. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: bootFadeOut 0.6s ease 3s forwards;
      }
      #boot-loader iframe {
        width: min(80vw, 80vh, 600px);
        height: min(80vw, 80vh, 600px);
        border: 0;
        background: transparent;
      }
      @keyframes bootFadeOut {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <iframe src="/models/loadingawal-masukweb.html" title="Loading"></iframe>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
