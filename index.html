<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL HUD Portfolio</title>
    <!-- Load Orbitron and Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <style>
      /* R28 v6 — Inline Rubik loader (no iframe). Animation 100% CSS, no JS. */

      /* Loader container — handshake exit with HeroOverlay GSAP intro. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        animation: bootFadeOut 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3s forwards;
      }

      /* Inline Rubik stage — same animation as loadingawal-masukweb.html */
      :root {
        --size: 42px;
        --half: 21px;
        --gap: 3px;
        --color-top: #22D3EE;
        --color-right: #0ea5e9;
        --color-left: #0369a1;
        --color-dark: #0f172a;
      }
      .stage {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-style: preserve-3d;
        perspective: 1200px;
        animation: bootExplode 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3s forwards;
      }
      .floor-shadow {
        position: absolute;
        width: 140px;
        height: 140px;
        background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.25) 0%, rgba(15, 23, 42, 0) 70%);
        transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px);
        border-radius: 50%;
        filter: blur(8px);
        animation: shadowPulse 4.5s ease-in-out infinite;
      }
      .rubik-group {
        position: relative;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: rotateX(60deg) rotateZ(-45deg);
        animation: groupRotate 4.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .cube {
        position: absolute;
        width: var(--size);
        height: var(--size);
        transform-style: preserve-3d;
        top: calc(var(--size) * -0.5);
        left: calc(var(--size) * -0.5);
        animation: assembleCube 4.5s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
        opacity: 0;
      }
      .face {
        position: absolute;
        width: var(--size);
        height: var(--size);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backface-visibility: hidden;
      }
      .face.top    { background-color: var(--color-top);   transform: rotateX(0deg) translateZ(var(--half));   box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.4); }
      .face.bottom { background-color: var(--color-dark);  transform: rotateX(180deg) translateZ(var(--half)); }
      .face.left   { background-color: var(--color-left);  transform: rotateY(-90deg) translateZ(var(--half)); }
      .face.right  { background-color: var(--color-right); transform: rotateY(90deg) translateZ(var(--half)); }
      .face.front  { background-color: var(--color-left);  transform: rotateX(-90deg) translateZ(var(--half)); }
      .face.back   { background-color: var(--color-right); transform: rotateX(90deg) translateZ(var(--half)); }

      .c1 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.05s; }
      .c2 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.20s; }
      .c3 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.35s; }
      .c4 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(-0.5 * (var(--size) + var(--gap))); --delay: 0.50s; }
      .c5 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 0.70s; }
      .c6 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(-0.5 * (var(--size) + var(--gap))); --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 0.85s; }
      .c7 { --tx: calc(-0.5 * (var(--size) + var(--gap))); --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 1.00s; }
      .c8 { --tx: calc(0.5 * (var(--size) + var(--gap)));  --ty: calc(0.5 * (var(--size) + var(--gap)));  --tz: calc(0.5 * (var(--size) + var(--gap)));  --delay: 1.15s; }
      .cube { animation-delay: var(--delay); }

      @keyframes assembleCube {
        0%   { transform: translate3d(var(--tx), var(--ty), calc(var(--tz) + 70px)) scale(0.1); opacity: 0; }
        15%  { transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);              opacity: 1; }
        70%  { transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1);              opacity: 1; }
        82%  { transform: translate3d(calc(var(--tx) * 1.3), calc(var(--ty) * 1.3), calc(var(--tz) * 1.3)) scale(0.9); opacity: 0.8; }
        92%, 100% { transform: translate3d(var(--tx), var(--ty), calc(var(--tz) - 60px)) scale(0); opacity: 0; }
      }
      @keyframes groupRotate {
        0%, 25%   { transform: rotateX(60deg) rotateZ(-45deg) translateZ(0); }
        50%, 75%  { transform: rotateX(60deg) rotateZ(135deg) translateZ(10px); }
        90%, 100% { transform: rotateX(60deg) rotateZ(315deg) translateZ(0); }
      }
      @keyframes shadowPulse {
        0%, 25%   { transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(0.8); opacity: 0.4; }
        50%, 75%  { transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(1.1); opacity: 0.7; }
        90%, 100% { transform: rotateX(60deg) rotateZ(45deg) translateZ(-110px) scale(0.7); opacity: 0.2; }
      }

      /* Handshake: loader fades + Rubik explodes outward at 3s */
      @keyframes bootFadeOut {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      @keyframes bootExplode {
        0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        100% { transform: scale(1.4) rotate(45deg); opacity: 0; filter: blur(8px); }
      }

      /* React root fade-in paralel dengan loader exit */
      #root {
        opacity: 0;
        animation: rootFadeIn 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3.1s forwards;
      }
      @keyframes rootFadeIn {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cube, .rubik-group, .floor-shadow { animation: none; opacity: 1; }
        #boot-loader { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="stage">
        <div class="floor-shadow"></div>
        <div class="rubik-group">
          <div class="cube c1"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c2"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c3"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c4"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c5"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c6"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c7"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
          <div class="cube c8"><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div><div class="face back"></div></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
