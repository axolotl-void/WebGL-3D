<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL HUD Portfolio</title>
    <!-- Load Orbitron and Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <style>
      /* R28 v5 — Loader exit handshake. Ruby "explodes outward" (scale + rotate)
         while fading, exactly matching the GSAP intro start in HeroOverlay so
         there is no perceived gap between loader-out and app-in. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: bootFadeOut 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3s forwards;
      }
      #boot-loader iframe {
        width: min(80vw, 80vh, 600px);
        height: min(80vw, 80vh, 600px);
        border: 0;
        background: transparent;
        animation: bootExplode 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3s forwards;
      }
      @keyframes bootFadeOut {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      @keyframes bootExplode {
        0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        100% { transform: scale(1.4) rotate(45deg); opacity: 0; filter: blur(8px); }
      }
      /* React root start hidden dan fade-in paralel dengan loader exit */
      #root {
        opacity: 0;
        animation: rootFadeIn 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3.1s forwards;
      }
      @keyframes rootFadeIn {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <iframe src="/models/loadingawal-masukweb.html" title="Loading"></iframe>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
